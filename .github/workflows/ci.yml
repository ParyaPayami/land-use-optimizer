name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check pimaluos tests
      - name: Tests
        run: pytest -q --cov=pimaluos --cov-report=term --cov-report=xml
      - name: CLI smoke run (synthetic city)
        run: |
          pimaluos run --config configs/smoke.yaml --out /tmp/smoke
          pimaluos report --results /tmp/smoke --out /tmp/smoke_gen
          test -f /tmp/smoke_gen/macros.tex
