[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pimaluos"
version = "0.2.0"
description = "Multi-agent FAR optimisation on parcel graphs with planning-scale capacity screens"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Parya Payami", email = "ppayami@uwm.edu"}]
keywords = ["urban planning", "land use", "zoning", "graph neural networks",
            "multi-agent reinforcement learning", "NSGA-III", "MapPLUTO"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.5",
    "pyarrow>=12",
    "scipy>=1.10",
    "torch>=2.1",
    "torch-geometric>=2.4",
    "pymoo>=0.6.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
rag = ["openai>=1.0", "anthropic>=0.30", "ollama>=0.2", "pypdf>=4.0", "faiss-cpu>=1.7.4",
       "sentence-transformers>=2.2"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
pimaluos = "pimaluos.cli:main"

[project.urls]
Repository = "https://github.com/ParyaPayami/land-use-optimizer"
Issues = "https://github.com/ParyaPayami/land-use-optimizer/issues"

[tool.setuptools.packages.find]
include = ["pimaluos*"]

[tool.setuptools.package-data]
pimaluos = ["config/cities/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
