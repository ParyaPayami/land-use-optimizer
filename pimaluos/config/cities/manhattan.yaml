# Manhattan, New York City
#
# Parcel data: NYC Department of City Planning MapPLUTO (shapefile or file
# geodatabase), downloaded manually from
#   https://www.nyc.gov/site/planning/data-maps/open-data/dwn-pluto-mappluto.page
# and passed to the loader with ``--pluto PATH`` (a .zip, .shp, .gpkg, .gdb or
# .geojson). Record the release (e.g. 24v4) in the run config; it is written to
# results/<run>/manifest.json.

name: manhattan
display_name: "Manhattan, NYC"
latitude: 40.7831
longitude: -73.9712
crs: "EPSG:2263"          # NAD83 / New York Long Island (ftUS)
crs_units_ft: true
# Reference point for the distance-to-centre feature (Grand Central Terminal).
center_lat: 40.7527
center_lon: -73.9772
borough_code: 1           # MapPLUTO BoroCode / Borough 'MN'

edge_types:
  - spatial_adjacency
  - proximity
  - functional_similarity
  - street_frontage
  - regulatory_coupling

# MapPLUTO column -> PIMALUOS standard column.
column_mapping:
  BBL: parcel_id
  Address: address
  LotArea: lot_area_sqft
  BldgArea: bldg_area_sqft
  NumFloors: num_floors
  YearBuilt: year_built
  YearAlter1: year_altered
  LandUse: land_use
  ZoneDist1: zone_district
  SPDist1: special_district
  SplitZone: split_zone
  Overlay1: overlay
  BuiltFAR: built_far
  ResidFAR: max_resid_far
  CommFAR: max_comm_far
  FacilFAR: max_facil_far
  ManuFAR: max_manu_far
  AffResFAR: max_affres_far
  AssessTot: assessed_total
  AssessLand: assessed_land
  UnitsRes: units_res
  UnitsTotal: units_total
  BldgClass: bldg_class
  HistDist: historic_district
  Landmark: landmark
  LotFront: lot_front
  LotDepth: lot_depth
  BldgFront: bldg_front
  BldgDepth: bldg_depth
  IrrLotCode: irregular_lot
  ResArea: res_area
  ComArea: com_area
  OfficeArea: office_area
  RetailArea: retail_area
  GarageArea: garage_area
  StrgeArea: storage_area
  FactryArea: factory_area
  PFIRM15_FL: flood_2015
  FIRM07_FLA: flood_2007
